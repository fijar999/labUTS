<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bookstore</title>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/data.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body class="login-page">
    <header class="login-header">
        <h1>BookStore</h1>
        <p>Toko Buku Online</p>
    </header>

    <main class="login-container">
        <section class="login-card">
            <div class="login-title">
                <h1>Selamat Datang</h1>
                <p>Silahkan login untuk melanjutkan</p>
            </div>

            <!--form login-->
            <form id="formLogin">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan Email"
                        required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required>
                </div>
                <button type="submit" class="btn-primary">
                    Login
                </button>
            </form>

            <div class="login-links">
                <button type="button" id="btnLupaPassword">
                    Lupa Password?
                </button>
                <span>Belum Memiliki Akun?</span>
                <button type="button" id="btnDaftar">
                    Daftar Sekarang
                </button>
            </div>
        </section>
    </main>

    <!--Modal lupa password-->
    <div class="modal" id="modalLupaPassword">
        <div class="modal-content">
            <button type="button" class="btn-close" data-close>
                &times;
            </button>
            <h2>Lupa Password</h2>
            <p>Masukkan enail yang terdaftar untuk memeriksa akun.</p>
            <form id="formLupaPassword">
                <div class="form-group">
                    <label for="emailLupa">Email</label>
                    <input
                        type="email"
                        id="emailLupa"
                        placeholder="Masukkan email"
                        required>
                </div>
                <button type="submit" class="btn-primary">
                    Periksa Akun
                </button>
            </form>
        </div>
    </div>

    <!--Modal daftar-->
    <div class="modal" id="modalDaftar">
        <div class="modal-content">
            <button type="button" class="btn-close" data-close>
                &times;
            </button>
            <h2>Daftar Akun</h2>
            <p>Lengkapi informasi untuk membuat akun baru.</p>
            <form id="formDaftar">
                <div class="form-group">
                    <label for="namaDaftar">Nama Lengkap</label>
                    <input
                        type="text"
                        id="namaDaftar"
                        placeholder="Masukkan nama"
                        required>
                </div>

                <div class="form-group">
                    <label for="emailDaftar">Email</label>
                    <input
                        type="email"
                        id="emailDaftar"
                        placeholder="Masukkan email"
                        required>
                </div>

                <div class="form-group">
                    <label for="passwordDaftar">Password</label>
                    <input
                        type="password"
                        id="passwordDaftar"
                        placeholder="Buat password"
                        minlength="6"
                        required>
                </div>
                <button type="submit" class="btn-primary">
                    Buat Akun
                </button>
            </form>
        </div>
    </div>
    <footer class="login-footer">
        <p>&copy; 2026 BookStore</p>
    </footer>
</body>
</html>
